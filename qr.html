<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сделать QR-код</title>
<style>
  :root { --accent: #4f46e5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #f4f5fb; color: #1c1e26;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; width: 100%; max-width: 560px; border-radius: 18px;
    box-shadow: 0 10px 40px rgba(20,20,60,.10); padding: 28px 26px 32px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: #667; }
  label { font-weight: 600; display: block; margin-bottom: 8px; }
  input[type=url] {
    width: 100%; padding: 14px 14px; font-size: 16px; border: 2px solid #d7d9e6;
    border-radius: 12px; outline: none;
  }
  input[type=url]:focus { border-color: var(--accent); }
  .btn {
    display: inline-block; border: 0; cursor: pointer; font-size: 16px; font-weight: 600;
    padding: 13px 18px; border-radius: 12px; margin-top: 14px;
  }
  .btn-main   { background: var(--accent); color: #fff; width: 100%; }
  .btn-ghost  { background: #eef0fb; color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; margin-top: 12px; }
  #result { margin-top: 24px; text-align: center; display: none; }
  #qrimg {
    width: 300px; max-width: 100%; height: auto; border: 1px solid #eee; border-radius: 12px;
    background: #fff;
  }
  #urlLabel { word-break: break-all; color: #445; margin-top: 12px; font-size: 14px; }
  .hintbox {
    margin-top: 20px; background: #f5f7ff; border: 1px solid #e2e6f7; border-radius: 12px;
    padding: 12px 14px; font-size: 14px; color: #556;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; }
    h1, p.sub, label, input, .btn, .row, .hintbox { display: none !important; }
    #result { display: block !important; margin-top: 40px; }
    #qrimg { width: 380px; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔳 Сделать QR-код</h1>
    <p class="sub">Вставьте ссылку на карточку и получите QR-код, который можно распечатать.</p>

    <label for="url">Ссылка (адрес карточки)</label>
    <input id="url" type="url" placeholder="https://ИМЯ.github.io/РЕПО/card1/"
           autocomplete="off" spellcheck="false">

    <button class="btn btn-main" onclick="makeQR()">Показать QR-код</button>

    <div id="result">
      <img id="qrimg" alt="QR-код">
      <div id="urlLabel"></div>
      <div class="row">
        <button class="btn btn-ghost" onclick="downloadQR()">⬇️ Скачать картинку</button>
        <button class="btn btn-ghost" onclick="window.print()">🖨️ Печать</button>
      </div>
    </div>

    <div class="hintbox">
      Не получается скачать? Нажмите на QR-код правой кнопкой мыши (на телефоне —
      удержите палец) и выберите «Сохранить изображение».
    </div>
  </div>

<script>
  var imgUrl = '';

  function makeQR() {
    var url = document.getElementById('url').value.trim();
    if (!url) { alert('Сначала вставьте ссылку на карточку.'); return; }
    imgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='
             + encodeURIComponent(url);
    document.getElementById('qrimg').src = imgUrl;
    document.getElementById('urlLabel').textContent = url;
    document.getElementById('result').style.display = 'block';
  }

  async function downloadQR() {
    if (!imgUrl) return;
    try {
      var resp = await fetch(imgUrl);
      var blob = await resp.blob();
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'qr-code.png';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {
      // если скачать напрямую нельзя — открываем картинку в новой вкладке
      window.open(imgUrl, '_blank');
    }
  }

  // Enter в поле ввода = показать QR
  document.getElementById('url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') makeQR();
  });
</script>
</body>
</html>
